# Defaults for a fresh install: nothing machine-specific here.
# The exchange folder defaults to ~/.dsh/codebuddy-bridge (override with
# `collabDir`), and the engine is discovered from the WorkBuddy install
# location (override with `cliPath` or the WORKBUDDY_CLI_PATH env var).
- insert:
    - id: codebuddy-bridge
      name: dsh-codebuddy-bridge
      config:
        # Read tools are auto-approved, writes are refused, and nothing ever waits
        # for a human. Editing a round is an explicit opt-in (`--edit` on the relay
        # route, `permissionMode: acceptEdits` on workbuddy_task), never the default.
        permissionMode: dontAsk
